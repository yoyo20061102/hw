<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 06</title>
    <style>
        table {
            /* Collapses table borders into a single border */
            border-collapse: collapse;
            width: 400px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px 12px;
            text-align: left;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Student ID</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- Replace with your actual name and student ID -->
                <td>Your name</td>
                <td>Your student ID</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
